server:
  port: 8085
spring:
  application:
    name: hmdp-plus
  # MCP Server：把商户/优惠券/订单查询能力以标准 MCP 协议暴露给 AI 客户端
  # 启动后端点：GET /sse（建立 SSE 流）、POST /mcp/message（发送 JSON-RPC 请求）
  ai:
    mcp:
      server:
        name: hmdp-plus-mcp
        version: 1.0.0
        type: SYNC
    # 智能客服：DeepSeek 通过 OpenAI 兼容协议接入
    # 不用 spring-ai.deepseek 是因为 Spring AI 1.0.0 的 DeepSeek 客户端会把
    # Double 字段（frequency_penalty 等）序列化成字符串，触发 DeepSeek 的 422
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          # 必须显式赋值，不能留 null：
          # 项目的 JsonCustomSerializer 会把 Number 类型的 null 序列化成空字符串 ""，
          # 而 DeepSeek API 要求 frequency_penalty/presence_penalty 是数字，否则 422
          frequency-penalty: 0
          presence-penalty: 0
          max-tokens: 2048
          # 同理：String 类型的 null 会被项目的 JsonCustomSerializer 写成 "",
          # 而 DeepSeek 要求该字段是枚举值之一，"" 会报 unknown variant
          reasoning-effort: none
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true  
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere.yaml
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1    
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    generator:
      # 不能开启：开启后 Spring AI 发往 DeepSeek 的请求里 frequency_penalty 等 Double
      # 会被序列化成字符串（如 "0.0"），DeepSeek 返回 422 invalid type: string, expected f32
      WRITE_NUMBERS_AS_STRINGS: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      #默认的消费组ID
      group-id: create_voucher_order
      #是否自动提交offset
      enable-auto-commit: false
      # 当kafka中没有初始offset或offset超出范围时将自动重置offset
      # earliest:重置为分区中最小的offset;
      # latest:重置为分区中最新的offset(消费分区中新产生的数据);
      # none:只要有一个分区不存在已提交的offset,就抛出异常;
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
mybatis-plus:
  type-aliases-package: org.javaup.entity # 别名扫描包
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
logging:
  level:
    org.javaup: info
    AUDIT: INFO
  pattern:
    dateformat: mm:ss.SSS
    # 日志中带上 traceId / spanId，便于把一次请求的所有日志串起来
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
bloom-filter:
  filters:
    shop:
      name: shop-id-bloom
      expected-insertions: 50000
      false-probability: 0.01
    voucher:
      name: voucher-id-bloom
      expected-insertions: 100000
      false-probability: 0.01
management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  prometheus:
    metrics:
      export:
        enabled: true
  # 链路埋点：全量采样（本地调试友好），生产环境应调低
  tracing:
    enabled: true
    sampling:
      probability: 1.0
      
